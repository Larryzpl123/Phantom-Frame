<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>机甲对战 · 极点</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;700;900&family=Ma+Shan+Zheng&display=swap">
<style>
  /* Layout: full-bleed WebGL; HUD and panels are dark glass with clipped corners pinned to the edges. */
  :root {
    --bg: #0b1116; --glass: rgba(12, 20, 26, .84); --glass-2: rgba(20, 32, 40, .9);
    --line: rgba(61, 224, 208, .35); --line-2: rgba(160, 200, 210, .18);
    --fg: #d6e6ea; --dim: #7f969d; --cyan: #3de0d0; --cyan-d: #1a6f69; --orange: #ff8a3d; --red: #ff5a4a;
    --tech: 'Chakra Petch', 'Noto Sans SC', system-ui, sans-serif;
    --cn: 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif;
    --brush: 'Ma Shan Zheng', 'STKaiti', 'KaiTi', serif;
    --cut: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font-family: var(--cn); overflow: hidden; font-size: 14px; }
  canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #scan { position: fixed; inset: 0; pointer-events: none; background:
    radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,.55) 100%),
    repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 3px); }
  [hidden] { display: none !important; }
  button, input, select { font: inherit; color: inherit; }
  kbd { font-family: var(--tech); font-weight: 600; font-size: 11px; min-width: 20px; padding: 1px 6px; border: 1px solid var(--line);
    background: rgba(61,224,208,.08); display: inline-block; text-align: center; color: var(--cyan); }
  .btn { background: rgba(61,224,208,.08); border: 1px solid var(--line); padding: 6px 12px; cursor: pointer; clip-path: var(--cut); }
  .btn:hover { background: rgba(61,224,208,.18); }
  .btn.primary { background: var(--cyan); color: #04211f; border-color: var(--cyan); font-weight: 700; }
  .btn.warn { border-color: rgba(255,138,61,.5); background: rgba(255,138,61,.1); color: #ffc29a; }
  .btn[aria-pressed="true"] { background: var(--cyan); color: #04211f; }
  .btn:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
  input[type=number], input[type=text], select { background: rgba(0,0,0,.35); border: 1px solid var(--line-2); padding: 3px 6px; min-width: 0; }
  input[type=range] { accent-color: var(--cyan); min-width: 0; }
  .eyebrow { font-family: var(--tech); font-size: 11px; letter-spacing: .28em; color: var(--cyan); text-transform: uppercase; }
  .num { font-family: var(--tech); font-variant-numeric: tabular-nums; }

  /* ---------- menu ---------- */
  #menu { position: fixed; inset: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 420px); align-items: center;
    padding: 4vh max(16px, 4vw); gap: 24px; pointer-events: none; }
  #menu > * { pointer-events: auto; }
  .title { align-self: end; padding-bottom: 4vh; }
  .title h1 { margin: 6px 0 0; line-height: .9; font-weight: 400; font-size: clamp(90px, 15vw, 210px); }
  .title h1.ink { font-family: var(--brush); color: #e9f4f1; text-shadow: 0 0 30px rgba(61,224,208,.25); }
  .title h1.tech { font-family: var(--tech); font-weight: 700; letter-spacing: .02em; }
  .title p { margin: 8px 0 0; color: var(--dim); max-width: 46ch; line-height: 1.6; }
  .panel { background: var(--glass); border: 1px solid var(--line); padding: 20px; display: grid; gap: 12px; max-height: calc(100vh - 40px); overflow-y: auto; clip-path: var(--cut); backdrop-filter: blur(6px); }
  .panel h2 { margin: 0; font-family: var(--tech); font-size: 20px; letter-spacing: .08em; }
  .roster { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; max-height: 132px; overflow-y: auto; }
  .roster button { text-align: left; padding: 5px 9px; border: 1px solid var(--line-2); background: rgba(255,255,255,.02); cursor: pointer; display: grid; gap: 2px; clip-path: var(--cut); }
  .roster button b { font-size: 16px; font-weight: 700; }
  .roster button b.ink { font-family: var(--brush); font-weight: 400; font-size: 19px; }
  .roster button small { color: var(--dim); font-size: 10px; }
  .roster button[aria-pressed="true"] { border-color: var(--cyan); background: rgba(61,224,208,.12); }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .go { font-family: var(--tech); font-size: 20px; letter-spacing: .3em; padding: 10px 0; }
  .keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; font-size: 12px; color: var(--dim); align-items: center; margin: 0; }
  .keys dd { margin: 0; }
  .note { font-size: 12px; color: var(--dim); margin: 0; line-height: 1.6; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; }
  .bar-block { position: absolute; top: 16px; width: min(36vw, 420px); display: grid; gap: 4px; }
  .bar-block.a { left: max(16px, 2vw); }
  .bar-block.b { right: max(16px, 2vw); text-align: right; }
  .bar-block .nm { font-family: var(--tech); font-weight: 700; font-size: 24px; line-height: 1; letter-spacing: .04em; }
  .bar-block .nm.ink { font-family: var(--brush); font-weight: 400; font-size: 32px; }
  .bar { height: 10px; border: 1px solid var(--line); background: rgba(0,0,0,.4); overflow: hidden;
    background-image: repeating-linear-gradient(90deg, transparent 0 9%, rgba(0,0,0,.6) 9% 10%); }
  .bar i { display: block; height: 100%; transform-origin: left; transition: transform .12s; }
  .a .bar i { background: linear-gradient(90deg, var(--cyan-d), var(--cyan)); box-shadow: 0 0 12px rgba(61,224,208,.6); }
  .b .bar i { background: linear-gradient(270deg, #7a3416, var(--orange)); transform-origin: right; box-shadow: 0 0 12px rgba(255,138,61,.5); }
  .sub { font-family: var(--tech); font-size: 11px; color: var(--dim); letter-spacing: .08em; }
  .gauges { position: absolute; left: max(16px, 2vw); bottom: 18px; display: grid; gap: 4px; width: min(30vw, 260px); font-size: 11px; font-family: var(--tech); letter-spacing: .1em; color: var(--dim); }
  .gauges .bar { height: 6px; }
  .gauges .bar i { background: var(--cyan); }
  #heat { background: var(--orange) !important; }
  #ki { background: #b49bff !important; box-shadow: 0 0 10px rgba(180,155,255,.6); }
  #moves { position: absolute; right: max(16px, 2vw); bottom: 18px; display: grid; gap: 4px; font-size: 12px; justify-items: end; }
  .move { display: flex; gap: 8px; align-items: center; background: var(--glass); padding: 3px 8px; border-left: 2px solid var(--cyan); }
  #round { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); font-family: var(--tech); font-size: 13px; letter-spacing: .12em; color: var(--fg);
    background: var(--glass); border: 1px solid var(--line-2); padding: 4px 14px; white-space: nowrap; }
  #fighters { position: absolute; right: max(16px, 2vw); top: 96px; display: grid; gap: 6px; width: min(26vw, 260px); }
  .fighter { display: grid; grid-template-columns: 5.5em minmax(0, 1fr); gap: 8px; align-items: center; font-size: 12px; background: var(--glass); padding: 3px 8px; }
  .fighter .bar { height: 6px; } .fighter .bar i { transform-origin: left; }
  .fighter.ally span { color: var(--cyan); } .fighter.tgt { outline: 1px solid var(--orange); }
  .basics { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); font-size: 11px; color: var(--dim); white-space: nowrap; font-family: var(--tech); }
  #flash { position: absolute; left: 50%; top: 28%; transform: translate(-50%, -50%); font-family: var(--tech); font-weight: 700; font-size: 54px; letter-spacing: .2em; color: var(--cyan); opacity: 0; text-shadow: 0 0 20px rgba(61,224,208,.7); }
  #flash.on { animation: flash .9s ease-out; }
  @keyframes flash { 0% { opacity: 0; transform: translate(-50%,-50%) scale(1.4); } 15% { opacity: 1; transform: translate(-50%,-50%) scale(1); } 100% { opacity: 0; transform: translate(-50%,-62%) scale(1); } }
  .result { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(5,10,14,.45); }
  .result .card { display: grid; justify-items: center; gap: 12px; }
  #resultText { font-family: var(--tech); font-weight: 700; font-size: clamp(90px, 16vw, 180px); line-height: 1; letter-spacing: .1em; }
  #resultText.win { color: var(--cyan); text-shadow: 0 0 40px rgba(61,224,208,.6); }
  #resultText.lose { color: var(--orange); text-shadow: 0 0 40px rgba(255,138,61,.5); }
  #stale { position: fixed; left: 0; right: 0; top: 0; background: var(--red); color: #fff; padding: 8px 16px; font-size: 14px; z-index: 9; }

  /* ---------- hangar ---------- */
  #hangar { position: fixed; inset: 0; pointer-events: none; }
  #hangar > * { pointer-events: auto; }
  .topbar { position: absolute; left: 0; right: 0; top: 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    padding: 10px max(16px, 1.5vw); background: linear-gradient(180deg, rgba(8,14,18,.95), rgba(8,14,18,.6)); border-bottom: 1px solid var(--line-2); }
  .topbar .grow { flex: 1; }
  .topbar input[type=text] { width: 9em; font-weight: 700; }
  .palette { position: absolute; left: max(12px, 1vw); top: 64px; bottom: 44px; width: 150px; overflow-y: auto; display: grid; gap: 4px; align-content: start;
    background: var(--glass); border: 1px solid var(--line-2); padding: 8px; clip-path: var(--cut); }
  .palette button { display: grid; grid-template-columns: 1fr auto; gap: 2px 6px; text-align: left; padding: 6px 8px; background: transparent; border: 1px solid transparent; cursor: pointer; }
  .palette button:hover { border-color: var(--line-2); }
  .palette button[aria-pressed="true"] { border-color: var(--cyan); background: rgba(61,224,208,.12); }
  .palette small { grid-column: 1 / -1; color: var(--dim); font-size: 11px; }
  .palette .num { color: var(--orange); font-size: 12px; }
  .side { position: absolute; right: max(12px, 1vw); top: 64px; bottom: 44px; width: min(360px, 40vw); display: grid; grid-template-rows: auto 1fr; gap: 0;
    background: var(--glass); border: 1px solid var(--line-2); clip-path: var(--cut); min-height: 0; }
  .tabs { display: flex; border-bottom: 1px solid var(--line-2); }
  .tabs button { flex: 1; padding: 8px; background: transparent; border: 0; cursor: pointer; color: var(--dim); font-family: var(--tech); letter-spacing: .1em; }
  .tabs button[aria-selected="true"] { color: var(--cyan); box-shadow: inset 0 -2px 0 var(--cyan); }
  .tabpane { overflow-y: auto; padding: 12px; display: grid; gap: 12px; align-content: start; min-height: 0; }
  .card { border: 1px solid var(--line-2); padding: 10px; display: grid; gap: 8px; }
  .card h3 { margin: 0; font-size: 12px; font-family: var(--tech); letter-spacing: .18em; color: var(--cyan); font-weight: 600; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 12px; }
  .kv span:nth-child(odd) { color: var(--dim); }
  .loadbar { height: 8px; background: rgba(0,0,0,.4); border: 1px solid var(--line-2); }
  .loadbar i { display: block; height: 100%; background: var(--cyan); transform-origin: left; }
  .loadbar.over i { background: var(--red); }
  .issues { color: var(--red); font-size: 12px; margin: 0; padding-left: 16px; }
  .xyz { display: grid; grid-template-columns: 3em repeat(3, minmax(0, 1fr)); gap: 4px; align-items: center; font-size: 12px; }
  .xyz label { color: var(--dim); }
  .xyz input { width: 100%; box-sizing: border-box; }
  .slide { display: grid; grid-template-columns: 4.5em minmax(0, 1fr) 3.4em; gap: 6px; align-items: center; font-size: 12px; }
  .slide label { color: var(--dim); }
  .slide output { font-family: var(--tech); text-align: right; font-size: 11px; }
  .btnrow { display: flex; gap: 6px; flex-wrap: wrap; }
  .btnrow .btn { padding: 4px 10px; font-size: 12px; }
  .actlist { display: grid; gap: 4px; }
  .actlist button { display: flex; justify-content: space-between; gap: 8px; text-align: left; padding: 5px 8px; border: 1px solid var(--line-2); background: transparent; cursor: pointer; }
  .actlist button[aria-pressed="true"] { border-color: var(--cyan); background: rgba(61,224,208,.1); }
  .timeline { position: relative; height: 34px; border: 1px solid var(--line-2); background: rgba(0,0,0,.3); cursor: pointer; }
  .timeline .k { position: absolute; top: 6px; width: 10px; height: 20px; margin-left: -5px; background: var(--dim); clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
  .timeline .k.sel { background: var(--cyan); }
  .timeline .ph { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--orange); pointer-events: none; }
  .jrow { display: grid; grid-template-columns: 1.2em 5.4em minmax(0, 1fr) 3.2em; gap: 6px; align-items: center; font-size: 12px; }
  .jrow.hot { background: rgba(61,224,208,.1); }
  .jrow.off label, .jrow.off output { color: var(--dim); opacity: .55; }
  .hint { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); font-size: 11px; color: var(--dim); white-space: nowrap; font-family: var(--tech);
    background: var(--glass); padding: 4px 10px; }
  .toast { position: absolute; left: 50%; top: 70px; transform: translateX(-50%); background: var(--glass-2); border: 1px solid var(--line); padding: 6px 14px; font-size: 13px; }

  @media (max-width: 760px) {
    #menu { grid-template-columns: 1fr; align-content: end; }
    .title h1 { font-size: 80px; }
    .basics, .hint { display: none; }
    .side { width: calc(100% - 24px); top: auto; height: 46%; }
    .palette { bottom: calc(46% + 56px); }
  }
  @media (prefers-reduced-motion: reduce) { #flash.on { animation: none; opacity: .9; } }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="scan"></div>

<section id="menu">
  <div class="title">
    <span class="eyebrow">机甲对战 · MECH ARENA</span>
    <h1 id="heroName" class="ink">极点</h1>
    <p id="heroDesc">青色水墨机。8.9 米长枪，刺、扫、旋，转枪劈弹。</p>
  </div>
  <div class="panel">
    <h2>出战</h2>
    <span class="eyebrow">我的机体</span>
    <div class="roster" id="rosterMe" role="group" aria-label="我的机体"></div>
    <span class="eyebrow">对手</span>
    <div class="roster" id="rosterFoe" role="group" aria-label="对手"></div>
    <div class="row"><label for="level">AI 难度</label>
      <select id="level"><option value="0">木桩（不动）</option><option value="2">缓</option><option value="8" selected>常</option><option value="16">烈</option><option value="25">狂</option><option value="30">极</option></select>
    </div>
    <div class="row"><label for="mode">模式</label>
      <select id="mode"><option value="duel">单挑 1v1</option><option value="ffa">混战（4 台）</option><option value="team2">组队 2v2</option><option value="team3">组队 3v3</option></select>
      <label for="map">地图</label><select id="map"></select>
    </div>
    <button class="btn primary go" id="go">开战</button>
    <button class="btn" id="ladder">AI 天梯</button>
    <button class="btn" id="toHangar">机库 · 搭建 / 动作编辑</button>
    <dl class="keys">
      <dt><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></dt><dd>移动（锁定对手，A/D 绕圈）</dd>
      <dt><kbd>空格</kbd></dt><dd>跳；空中按住 = 推进器悬停</dd>
      <dt><kbd>Shift</kbd></dt><dd>冲刺（短暂无敌）</dd>
      <dt><kbd>J</kbd><kbd>K</kbd><kbd>L</kbd>…</dt><dd>动作键（战斗右下角有列表），连按出连招；左键=J 右键=K</dd>
      <dt><kbd>Esc</kbd></dt><dd>回菜单　结算后 <kbd>R</kbd> 再来</dd>
    </dl>
    <p class="note">伤害看刃速。刀剑和枪杆高速扫过子弹会劈掉它，转枪能挡正面；炮弹只有刀剑能劈。零件被打断会掉落，核心被毁即败。</p>
  </div>
</section>

<section id="hud" hidden>
  <div class="bar-block a"><span class="nm" id="nameA">极点</span><div class="bar"><i id="hpA"></i></div><span class="sub" id="intA"></span></div>
  <div class="bar-block b"><span class="nm" id="nameB">玄岳</span><div class="bar"><i id="hpB"></i></div><span class="sub" id="intB"></span></div>
  <div class="gauges">
    <span>BOOST</span><div class="bar"><i id="boost"></i></div>
    <div id="heatWrap" hidden><span>HEAT</span><div class="bar"><i id="heat"></i></div></div>
    <div id="kiWrap" hidden><span id="kiLabel">PHANTOM</span><div class="bar"><i id="ki"></i></div></div>
  </div>
  <div id="round" hidden></div>
  <div id="fighters" hidden></div>
  <div id="moves"></div>
  <div class="basics">WASD 移动 · 空格 跳/悬停 · SHIFT 冲刺 · ESC 菜单</div>
  <div id="flash"></div>
</section>

<section class="result" id="result" hidden>
  <div class="card">
    <div id="resultText">胜</div>
    <div id="resultSub" class="num"></div>
    <div class="btnrow"><button class="btn primary" id="again">再来一局 (R)</button><button class="btn" id="back">菜单 (Esc)</button></div>
  </div>
</section>

<section id="hangar" hidden>
  <div class="topbar">
    <span class="eyebrow">机库</span>
    <input type="text" id="bpName" aria-label="机体名称" maxlength="24">
    <select id="loadSel" aria-label="载入"><option value="">载入…</option></select>
    <button class="btn" id="hNew">新建</button>
    <button class="btn" id="hSave">保存</button>
    <button class="btn" id="hExport">导出</button>
    <button class="btn" id="hImport">导入</button>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
    <button class="btn" id="hUndo" title="Ctrl+Z">撤销</button>
    <button class="btn" id="hRedo" title="Ctrl+Shift+Z">重做</button>
    <button class="btn" id="hMirror" aria-pressed="true" title="M">镜像</button>
    <button class="btn" id="hTool" title="B 放置 / V 选择">放置</button>
    <span class="grow"></span>
    <button class="btn primary" id="hTest">试驾</button>
    <button class="btn" id="hBack">菜单</button>
  </div>
  <div class="palette" id="palette" aria-label="零件"></div>
  <div class="side">
    <div class="tabs" role="tablist">
      <button role="tab" id="tabBuild" aria-selected="true">属性</button>
      <button role="tab" id="tabAct" aria-selected="false">动作</button>
    </div>
    <div class="tabpane" id="paneBuild"></div>
    <div class="tabpane" id="paneAct" hidden></div>
  </div>
  <div class="hint" id="hHint"></div>
  <div class="toast" id="toast" hidden></div>
</section>
